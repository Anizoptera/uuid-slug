[package]
name = "uuid-slug-rust-competitors"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
fast-uuid-v7 = "=0.1.10"
hyperuuid = "=0.8.0"
id-forge = "=1.0.0"
leachuuid7 = "=0.1.0"
nativelite-uid = "=0.1.0"
nexus-id = "=2.0.0"
philiprehberger-id-gen = "=0.3.0"
qubit-id = { version = "=0.7.0", default-features = false, features = ["uuid"] }
rivid-core = "=1.1.0"
rok-ids = "=0.1.0"
serde_json = "1"
uniqer_rs = "=0.0.4"
uuid = { version = "=1.28.0", features = ["v4", "v7"] }
uuid-extra = "=0.0.2"
uuid-lite = "=1.10.8"
uuid-lite2 = "=1.10.1"
uuid-slug = { path = "../../rust/uuid-slug" }
uuid7 = { version = "=1.8.0", features = ["uuid"] }
uuid64rs = "=0.0.14"
uuidv4 = "=1.0.0"
uuidv7 = "=0.1.8"


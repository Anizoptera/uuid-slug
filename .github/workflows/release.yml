name: Release

# Tag pushes publish both packages unless RELEASE_PACKAGES_ON_TAG selects one recovery destination.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: Packages to publish from the selected release tag
        type: choice
        options: [both, npm, crate]
        default: both
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    permissions: {}
    uses: ./.github/workflows/check.yml

  prepare:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.packages.outputs.selected }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - id: packages
        run: bun scripts/release-selection.ts "${{ inputs.packages || vars.RELEASE_PACKAGES_ON_TAG }}"
      - id: evidence
        run: bun scripts/release-evidence.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: steps.evidence.outputs.found == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ steps.evidence.outputs.run-id }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.evidence.outputs.found != 'true'
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - if: steps.evidence.outputs.found != 'true'
        run: bun install --frozen-lockfile
      - name: Install the repository Rust toolchain
        if: steps.evidence.outputs.found != 'true'
        run: rustc --version && rustup show active-toolchain
      - if: steps.evidence.outputs.found != 'true'
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - if: steps.evidence.outputs.found != 'true'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-semver-checks@0.50.0
          fallback: none
      - if: steps.evidence.outputs.found != 'true'
        run: bun run build
      # Fresh npm archives must pass the default Deno package-resolution probe before publishing.
      - if: steps.evidence.outputs.found != 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: latest
      - if: steps.evidence.outputs.found != 'true'
        run: bun scripts/release-package.ts prepare
      - if: steps.evidence.outputs.found != 'true'
        run: bun scripts/release-crate.ts prepare
      - name: Bind Git history to reviewed registry archives
        if: steps.evidence.outputs.found != 'true'
        run: |
          npm_archive=(release-artifacts/reviewed-npm/*.tgz)
          crate_archive=(rust/target/reviewed-crate/*.crate)
          test "${#npm_archive[@]}" -eq 1 && test "${#crate_archive[@]}" -eq 1
          bun scripts/release-inputs.ts "$GITHUB_REF_NAME" release-artifacts/history "${npm_archive[0]}" "${crate_archive[0]}"
          bun scripts/release-report.ts
      # Publish jobs read artifacts from this workflow run, so restored evidence must be handed on again.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: |
            release-artifacts
            rust/target/reviewed-crate
          if-no-files-found: error

  publish-npm:
    if: needs.prepare.outputs.selected != 'crate'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence
          path: .
      - run: bun run build
      - run: bun scripts/release-package.ts publish

  publish-crate:
    if: needs.prepare.outputs.selected != 'npm'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - name: Install the repository Rust toolchain
        run: rustc --version && rustup show active-toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence
          path: .
      - id: preflight
        run: bun scripts/release-crate.ts check
      - id: bootstrap
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
        run: test -z "$BOOTSTRAP_TOKEN" || echo "available=true" >> "$GITHUB_OUTPUT"
      - id: auth
        if: steps.preflight.outputs.published != 'true' && steps.bootstrap.outputs.available != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - run: bun scripts/release-crate.ts publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CRATES_IO_BOOTSTRAP_TOKEN }}

  finalize:
    needs: [prepare, publish-npm, publish-crate]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') &&
      (needs.publish-crate.result == 'success' || needs.publish-crate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence
          path: .
      - if: needs.prepare.outputs.selected != 'crate'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/reviewed-npm/*.tgz
      - if: needs.prepare.outputs.selected != 'npm'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rust/target/reviewed-crate/*.crate
      - run: bun scripts/release-finalize.ts
        env:
          GH_TOKEN: ${{ github.token }}
          UUID_SLUG_RELEASE_PACKAGES: ${{ needs.prepare.outputs.selected }}

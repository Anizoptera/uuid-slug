name: Release

# A release is a pushed tag, and nothing else is. `bun run release <patch|minor|major>` bumps
# the manifest, commits and tags in one step, so the tag and the published version cannot
# disagree; `git push --follow-tags` starts this workflow. Dispatch is the repair path —
# select the tag ref and every step below re-runs against it.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run the same runtime and packed-browser checks on the tagged revision without credentials.
  verify:
    permissions: {}
    uses: ./.github/workflows/check.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Bounded because the runner default is six hours and this workflow serialises on a
    # concurrency group that never cancels: one wedged run blocks every later release until
    # a human notices. This job also holds a live OIDC identity, which must not stay alive
    # any longer than the upload needs.
    timeout-minutes: 5
    permissions:
      contents: write # attach the published tarball to the GitHub Release
      id-token: write # OIDC: npm provenance and build-provenance attestation
      attestations: write # GitHub's own attestation store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Both versions come from `.tool-versions`, the single toolchain declaration asdf also
      # reads. Bun builds `dist` and runs publish-clean, which packs; Node is still required
      # because `npm` is a Node script and it is npm that uploads and signs. Drift in either
      # version is drift in the artifact, which is why neither comes from runner defaults.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: bun run build

      # This check still packs separately until publish-clean's final-archive hook is available.
      - run: bun run artifact:check
      # A retry must match registry integrity before attestation or replacing release assets.
      - run: bun scripts/release-package.ts
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/*.tgz

      # The preflight preserved the tagged changelog body; repair existing release notes too.
      - name: Publish the GitHub Release and attach the tarball
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-artifacts/notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file release-artifacts/notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-artifacts/*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}

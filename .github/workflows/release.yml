name: Release

on:
  workflow_dispatch:
  push:
    branches: [main, "v*.x"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # Both jobs here are bounded, because the runner default is six hours and this workflow
    # serialises on a concurrency group that never cancels: one wedged run blocks every
    # later release until a human notices. The publish job additionally holds a live OIDC
    # identity, which must not stay alive any longer than the upload needs.
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # attach the published tarball to the GitHub Release
      id-token: write # OIDC: npm provenance and build-provenance attestation
      attestations: write # GitHub's own attestation store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: latest
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # This job holds the publish credential and the OIDC token, so it does the minimum
      # that needs them: build, pack, publish, attest, attach. The repository's
      # verification lane is `bun run check`, which the Check workflow already ran on this
      # exact commit without any credentials. `pnpm run publish:clean` chains that lane in
      # front of the publish, which is right on a developer's machine and wrong here: it
      # would execute the test suite, which writes shell shims onto PATH and runs fixture
      # lifecycle scripts, right next to a live npm token.
      - run: bun run build

      # Every step below is repeatable, because a run that publishes and then fails
      # otherwise leaves the registry, the tag and the Release permanently out of step with
      # no way back: npm refuses to republish a version, so an existing version packs in
      # dry-run mode instead. `npm pack` normalises file mtimes, so the re-packed bytes
      # equal the published ones and stay a truthful attestation subject.
      - name: Pack, and publish unless this version is already on the registry
        run: |
          mode=""
          spec="$(node -p '`${require("./package.json").name}@${require("./package.json").version}`')"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already on the registry; re-packing to repair the release artifacts."
            mode="--dry-run"
          fi
          ./node_modules/.bin/publish-clean $mode --tarball-out release-artifacts -- --access public --tag latest --provenance
        env:
          # BOOTSTRAP ONLY — delete this env block, the secret, and the token once a
          # trusted publisher is bound to this package. npm cannot attach a trusted
          # publisher to a name nobody has published, so the first release of any package
          # must authenticate with a token; every later one authenticates with the OIDC
          # identity alone. See publish-clean's docs/first-publish.md.
          #
          # Leaving it in place is worse than the bootstrap itself: while a token exists, a
          # broken trusted-publisher configuration is silently papered over, and the
          # failure surfaces on whatever future day the token expires rather than on the
          # run that broke it.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm's own provenance covers the registry; this is the second, registry-independent
      # path (`gh attestation verify`). The subject is the exact tarball the CLI published,
      # retained via --tarball-out — attesting a re-pack would attest bytes nobody received.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/*.tgz

      # The tag is derived from the manifest rather than from the release-please output so
      # that a workflow_dispatch run recovering a failed release still attaches the artifact
      # to the tag that release already created. release-please tags `v<version>` for this
      # single-package repo. Failing here is intended: a published version whose GitHub
      # Release carries no artifact is an incomplete release.
      - run: gh release upload "v$(node -p 'require("./package.json").version')" release-artifacts/*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}

name: Release

# Tags select immutable release history. Dispatch repairs the selected tag without changing inputs.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    permissions: {}
    uses: ./.github/workflows/check.yml

  prepare:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Install the repository Rust toolchain
        run: |
          version=$(awk '$1 == "rust" { print $2 }' .tool-versions)
          test -n "$version" && rustup toolchain install "$version" --profile minimal --target wasm32-unknown-unknown
          rustup override set "$version"
      - run: cargo install cargo-public-api --version 0.52.0 --locked
      - run: bun run build
      - run: bun scripts/release-package.ts prepare
      - run: bun scripts/release-crate.ts prepare
      - name: Bind Git history to reviewed registry archives
        run: |
          npm_archive=(release-artifacts/reviewed-npm/*.tgz)
          crate_archive=(rust/target/reviewed-crate/*.crate)
          test "${#npm_archive[@]}" -eq 1 && test "${#crate_archive[@]}" -eq 1
          bun scripts/release-inputs.ts "$GITHUB_REF_NAME" release-artifacts/history "${npm_archive[0]}" "${crate_archive[0]}"
          bun scripts/release-report.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: |
            release-artifacts
            rust/target/reviewed-crate
          if-no-files-found: error

  publish-npm:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence
          path: .
      - run: bun run build
      - run: bun scripts/release-package.ts publish

  publish-crate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - name: Install the repository Rust toolchain
        run: |
          version=$(awk '$1 == "rust" { print $2 }' .tool-versions)
          test -n "$version" && rustup toolchain install "$version" --profile minimal
          rustup override set "$version"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence
          path: .
      - id: preflight
        run: bun scripts/release-crate.ts check
      - id: bootstrap
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
        run: test -z "$BOOTSTRAP_TOKEN" || echo "available=true" >> "$GITHUB_OUTPUT"
      - id: auth
        if: steps.preflight.outputs.published != 'true' && steps.bootstrap.outputs.available != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - run: bun scripts/release-crate.ts publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CRATES_IO_BOOTSTRAP_TOKEN }}

  finalize:
    needs: [publish-npm, publish-crate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence
          path: .
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-artifacts/reviewed-npm/*.tgz
            rust/target/reviewed-crate/*.crate
      - run: bun scripts/release-finalize.ts
        env:
          GH_TOKEN: ${{ github.token }}

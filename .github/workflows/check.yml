name: Check

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `.tool-versions` is the single toolchain declaration, read by asdf locally
      # and by this action in CI, so a developer's shell runs what CI runs.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      # The artifact check runs publish-clean, a Node CLI that enforces a Node floor of its
      # own. Without this the lane silently uses whatever Node the runner image ships, so it
      # verifies a different toolchain from the one that publishes.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - run: bun run check:js && bun run perf:check

  rust-native:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
          - { runner: macos-15, arch: arm64 }
          - { runner: windows-2025, arch: x64 }
          - { runner: windows-11-arm, arch: arm64 }
    env:
      EXPECTED_ARCH: ${{ matrix.arch }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Install the repository Rust toolchain
        shell: bash
        run: |
          version=$(awk '$1 == "rust" { print $2 }' .tool-versions)
          test -n "$version" && rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy && rustup override set "$version"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ matrix.runner }}-${{ hashFiles('.tool-versions', 'rust/Cargo.lock', 'rust/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: rust-${{ matrix.runner }}-${{ hashFiles('.tool-versions', 'rust/Cargo.lock', 'rust/**/Cargo.toml') }}-
      - run: bun install --frozen-lockfile
      - run: bun run check:rust
      - name: Install the packaged API extractor
        if: matrix.runner == 'ubuntu-24.04'
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: Check the packaged API baseline
        if: matrix.runner == 'ubuntu-24.04'
        run: bun run api:check
      - name: Check 32-bit Rust builds
        if: matrix.runner == 'ubuntu-24.04'
        shell: bash
        run: |
          targets=(i686-unknown-linux-gnu armv7-unknown-linux-gnueabihf)
          rustup target add "${targets[@]}"
          for target in "${targets[@]}"; do
            cargo check --manifest-path rust/Cargo.toml -p uuid-slug --locked --target "$target" --all-features
            cargo check --manifest-path rust/Cargo.toml -p uuid-slug --locked --target "$target" --no-default-features
          done

  # Exercise the declared floor and newer native capabilities without asserting ordering.
  runtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [floor, lts/*, current]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - id: runtime
        env:
          SELECTED_NODE: ${{ matrix.node }}
        run: bun scripts/node-floor.ts >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}
          package-manager-cache: false
      # Vitest only: it is the suite that runs on Node, and the Bun suite is covered above.
      - run: bunx vitest run
      # Current engines exercise optional native paths that pinned runtimes cannot reach.
      - if: matrix.node == 'current'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - if: matrix.node == 'current'
        run: bun run build && bun test test/*.bun.test.ts && bun run perf:check

  # Packed browser/Deno consumers need external engines, so keep their setup outside local check.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - name: Install the repository Rust toolchain
        shell: bash
        run: |
          version=$(awk '$1 == "rust" { print $2 }' .tool-versions)
          test -n "$version" && rustup toolchain install "$version" --profile minimal --target wasm32-unknown-unknown && rustup override set "$version"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-browser-${{ hashFiles('.tool-versions', 'rust/Cargo.lock', 'rust/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: rust-browser-${{ hashFiles('.tool-versions', 'rust/Cargo.lock', 'rust/**/Cargo.toml') }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - name: Install the matching wasm-bindgen CLI
        shell: bash
        run: |
          version=$(bun -e 'const lock = Bun.TOML.parse(await Bun.file("rust/Cargo.lock").text()); const entry = lock.package.find(p => p.name === "wasm-bindgen"); if (!entry) throw Error("Cargo.lock has no wasm-bindgen"); process.stdout.write(entry.version);')
          directory="$RUNNER_TEMP/wasm-bindgen"
          archive="wasm-bindgen-$version-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p "$directory/gh-release" && cd "$directory"
          curl --fail --silent --show-error --location --output "gh-release/$archive" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/$archive"
          curl --fail --silent --show-error --location --remote-name "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/$archive.sha256sum"
          sha256sum --check "$archive.sha256sum" && tar -xzf "gh-release/$archive" --strip-components=1 && echo "$directory" >> "$GITHUB_PATH"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - run: bun run artifact:web
      - run: bun scripts/rust-wasm.ts

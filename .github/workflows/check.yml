name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `.tool-versions` is the single toolchain declaration, read by asdf locally
      # and by this action in CI, so a developer's shell runs what CI runs.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      # The artifact check runs publish-clean, a Node CLI that enforces a Node floor of its
      # own. Without this the lane silently uses whatever Node the runner image ships, so it
      # verifies a different toolchain from the one that publishes.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - run: bun run check

  # This package's sortability depends on what the RUNTIME's native UUIDv7 does, and that changed
  # underneath it: Node 26.6.0 added `crypto.randomUUIDv7`, which re-randomises all 74 random bits
  # per call and so sorts in creation order only about half the time inside a millisecond. The
  # pinned lane above cannot see it — it runs the Node in `.tool-versions` — so the defect reached
  # a consumer's database index before it reached a red build. `current` tracks the newest release
  # deliberately: an unpinned runtime is the point of a canary.
  #
  # The adapters probe for a capability's PRESENCE, never for its behaviour — there is no ordering
  # probe and there must not be one, because intra-millisecond ordering is not a guarantee of this
  # package and a probe would quietly make it one. So a new engine keeps this lane green only if
  # its generator still satisfies what the suite asserts; a behavioural surprise like the one above
  # is meant to turn it RED here, which is the whole reason the lane exists.
  runtimes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `20` is the FLOOR declared in package.json `engines.node`, and it is here because a
        # support claim nothing runs is not a support claim: until this entry existed, the manifest
        # promised Node 20 while the lane tested only `lts/*` and `current`. Verified 2026-08-12 on
        # Node 20.19.5 -- the whole vitest suite, both dist builds and a mask round trip all pass --
        # so this pins a property the package HAS rather than asserting an aspiration.
        # `scripts/check-artifact.ts` fails if `engines.node` moves away from `>=20` without this
        # entry moving with it; the two are one claim in two files and nothing else couples them.
        node: ["20", lts/*, current]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # Vitest only: it is the suite that runs on Node, and the Bun suite is covered above.
      - run: bunx vitest run

  # The browser bundle, executed by the engines that actually receive it. `exports["."]` sends
  # `deno`, `browser` and `default` to `dist/index.js`, and until this job existed nothing ran
  # that file anywhere except in-process under Bun. Chromium is the only lane that can prove it
  # reaches for no Node-only capability, because it is the only engine that genuinely lacks one —
  # verified 2026-08-12 by putting the Node build in its place, which fails naming `node:crypto`.
  #
  # Its own job, and OUT of `bun run check`, because it needs a ~150 MB Chromium download. Requiring
  # that to commit would be paid on every laptop and every other CI job for a check that changes
  # only when the build configuration does.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      # Deno resolves the `deno` export condition to the same bundle. It is here rather than in
      # `bun run check` so a developer needs neither Deno nor a browser binary to commit.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno run --allow-read --allow-env scripts/probe-web-bundle.ts "$PWD/dist/index.js"

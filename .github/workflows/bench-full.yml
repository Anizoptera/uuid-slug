name: Benchmark Full

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark to run
        type: choice
        options: [full, rust-codec]
        default: full

permissions:
  contents: read

concurrency:
  group: bench-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench-full:
    if: inputs.suite == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bun run bench:full

  # Native evidence for Rust codec kernels on the CPU families GitHub's free runners offer: x86 and
  # ARM Linux, Intel and Apple-silicon macOS. Pools change and mix CPU generations, so each job logs
  # its CPU; read results per CPU model (bench/decisions.md records which models were measured).
  # bench/rust.ts --codec times production against each opt-in feature in one paired,
  # order-alternated schedule on one machine, which keeps a noisy shared runner usable.
  rust-codec:
    if: inputs.suite == 'rust-codec'
    runs-on: ${{ matrix.runner }}
    # Parallel copies land on independent runners: each is a replicate on its own machine, and
    # four ubuntu-latest draws make most generations in that mixed pool likely in one dispatch.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, replicate: 1 }
          - { runner: ubuntu-latest, replicate: 2 }
          - { runner: ubuntu-latest, replicate: 3 }
          - { runner: ubuntu-latest, replicate: 4 }
          - { runner: ubuntu-24.04-arm, replicate: 1 }
          - { runner: ubuntu-24.04-arm, replicate: 2 }
          - { runner: macos-15-intel, replicate: 1 }
          - { runner: macos-15-intel, replicate: 2 }
          - { runner: macos-latest, replicate: 1 }
          - { runner: macos-latest, replicate: 2 }
    steps:
      - run: uname -m && { lscpu 2>/dev/null | grep -iE 'model name|vendor' || sysctl -n machdep.cpu.brand_string; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile && UUID_SLUG_CODEC_FEATURES=uuid-simd bun bench/rust.ts --codec
      # The same pairs as simd128 WebAssembly under the image's Node (V8): one wasm binary serves every host CPU.
      - run: node --version && UUID_SLUG_CODEC_TARGET=wasm32-wasip1 UUID_SLUG_CODEC_FEATURES=uuid-simd bun bench/rust.ts --codec

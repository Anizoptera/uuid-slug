name: Benchmark Full

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark to run
        type: choice
        options: [full, rust-codec-x86]
        default: full
      rustflags:
        description: Extra RUSTFLAGS for both rust-codec-x86 builds (layout experiments)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: bench-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench-full:
    if: inputs.suite == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bun run bench:full

  # Native x86_64 evidence for Rust codec kernels. GitHub's ubuntu-latest pool mixes AMD EPYC
  # (Zen 3/4/5) and Intel Xeon generations whose SIMD speed differs, so each job logs its CPU and
  # times on whatever it drew; read results per CPU model.
  # bench/rust.ts --codec times production against each opt-in feature in one paired,
  # order-alternated schedule on one machine, which keeps a noisy shared runner usable.
  rust-codec-x86:
    if: inputs.suite == 'rust-codec-x86'
    runs-on: ubuntu-latest
    # Parallel copies land on independent runners: each is a replicate on its own machine, and
    # several draws make most CPU generations in the pool likely in one dispatch.
    strategy:
      fail-fast: false
      matrix:
        replicate: [1, 2, 3, 4, 5, 6]
    steps:
      - run: grep -m1 'model name' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - env:
          RUSTFLAGS: ${{ inputs.rustflags }}
        run: bun install --frozen-lockfile && UUID_SLUG_CODEC_FEATURES=uuid-simd bun bench/rust.ts --codec

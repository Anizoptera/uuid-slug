[workspace]
members = ["uuid-slug", "bridge"]
resolver = "3"

[workspace.package]
version = "0.4.1-dev"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/Anizoptera/uuid-slug"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

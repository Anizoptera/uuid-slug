[package]
name = "uuid-slug-benchmark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std", "fast-rng"]
std = ["uuid-slug/std"]
os-rng = ["uuid-slug/os-rng"]
fast-rng = ["std", "os-rng", "uuid-slug/fast-rng"]
wasm-js = ["std", "os-rng", "uuid-slug/wasm-js"]
browser-entropy = ["dep:getrandom"]

[dependencies]
uuid-slug = { path = "../uuid-slug", default-features = false }
serde_json = "1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
# Select the consumer's JS entropy backend without enabling std on the product crate.
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"], optional = true }

[lints]
workspace = true

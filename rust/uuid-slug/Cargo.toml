[package]
name = "uuid-slug"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "UUIDv4/v7 generation, short base64url/base32hex slugs, and reversible UUIDv7 masking"
# Broad encoding keywords aid discovery; the description names the exact alphabets.
keywords = ["uuid", "uuidv7", "short-uuid", "base64", "base32"]
categories = ["encoding", "no-std", "wasm"]
exclude = ["benches/"]

[package.metadata.docs.rs]
all-features = true

[features]
# Secure generation is ordinary; third-party UUID interoperability is an explicit caller choice.
default = ["std", "fast-rng"]
uuid-interop = ["dep:uuid"]
std = []
fast-rng = ["std", "os-rng", "dep:chacha20"]
os-rng = ["dep:getrandom"]
wasm-js = ["std", "os-rng", "getrandom/wasm_js", "dep:js-sys"]

[dependencies]
uuid = { version = "1.29", default-features = false, optional = true }
getrandom = { version = "0.4", default-features = false, optional = true }
chacha20 = { version = "0.10.2", default-features = false, features = ["rng"], optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Date::now needs neither promise helpers nor dynamic JavaScript evaluation.
js-sys = { version = "0.3", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true

[[bench]]
name = "codec"
harness = false

[[example]]
name = "filesystem"
required-features = ["std", "os-rng"]

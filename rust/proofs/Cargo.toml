[package]
name = "uuid-slug-proofs"
version = "0.0.0"
edition = "2024"
publish = false

# Kani supplies its own compiler; keep proof artifacts outside the native workspace.
[workspace]

[lib]
path = "lib.rs"

[dependencies]
uuid-slug = { path = "../uuid-slug", default-features = false, features = ["std"] }
# Prove the actual parser called by Uuid::from_str without modeling standard-library UTF-8 checks.
# The runner requires this package ID to match the product's resolved parser dependency.
uuid = { version = "1.29", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = [
  'cfg(kani)',
  'cfg(verus_only)',
  'cfg(feature, values("std", "fast-rng", "os-rng", "wasm-js"))',
] }

[package]
name = "uuid-slug-proofs"
version = "0.0.0"
edition = "2024"
publish = false

# Kani supplies its own compiler; keep proof artifacts outside the native workspace.
[workspace]

[lib]
path = "lib.rs"

[dependencies]
uuid-slug = { path = "../uuid-slug", default-features = false, features = ["std"] }

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = [
  'cfg(kani)',
  'cfg(verus_only)',
  'cfg(feature, values("std", "fast-rng", "os-rng", "wasm-js", "uuid-interop"))',
] }
